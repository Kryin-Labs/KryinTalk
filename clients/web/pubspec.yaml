name: connecthub_web
description: ConnectHub Enterprise Communication Platform — Flutter Web Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP & Networking
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.1
  supabase_flutter: ^2.8.0

  # Routing
  go_router: ^14.2.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  flutter_lucide: ^1.6.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.3

  # Storage
  shared_preferences: ^2.2.3

  # File Picking
  file_picker: ^8.0.3

  # Utilities
  intl: ^0.19.0
  timeago: ^3.7.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
