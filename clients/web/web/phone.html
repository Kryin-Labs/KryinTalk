<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectHub — Interactive Phone Device Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1a1e2e 0%, #0d0f17 100%);
      color: #F1F5F9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Control Toolbar */
    .toolbar {
      height: 60px;
      background: rgba(15, 18, 28, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: #0F766E;
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.2px;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .select-dropdown {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #E2E8F0;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 10px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .select-dropdown:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #E2E8F0;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: #0F766E;
      color: #5EEAD4;
    }

    .tool-btn.primary {
      background: #0F766E;
      color: white;
      border-color: #14B8A6;
    }

    .tool-btn.primary:hover {
      background: #0D9488;
    }

    /* Simulator Workspace */
    .workspace {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    /* Hardware Phone Bezel */
    .phone-container {
      position: relative;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-bezel {
      background: #1e2230;
      border-radius: 54px;
      padding: 12px;
      box-shadow: 
        0 0 0 2px rgba(255, 255, 255, 0.15),
        0 25px 60px -15px rgba(0, 0, 0, 0.8),
        0 0 80px rgba(15, 118, 110, 0.15);
      position: relative;
      transition: all 0.3s ease;
    }

    /* Phone Side Buttons */
    .phone-bezel::before {
      content: '';
      position: absolute;
      left: -4px;
      top: 110px;
      width: 4px;
      height: 38px;
      background: #33384c;
      border-radius: 2px 0 0 2px;
      box-shadow: 0 50px 0 #33384c, 0 98px 0 #33384c;
    }

    .phone-bezel::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 140px;
      width: 4px;
      height: 60px;
      background: #33384c;
      border-radius: 0 2px 2px 0;
    }

    /* Phone Screen Window */
    .phone-screen {
      background: #FAF9F6;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.4);
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      background: #FAF9F6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 13px;
      font-weight: 700;
      color: #1C1917;
      z-index: 20;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    }

    .dynamic-island {
      width: 100px;
      height: 26px;
      background: #000000;
      border-radius: 20px;
      position: absolute;
      left: 50%;
      top: 9px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .dynamic-island:hover {
      width: 140px;
    }

    .camera-lens {
      width: 10px;
      height: 10px;
      background: #0a1128;
      border-radius: 50%;
      border: 1px solid #1a2544;
    }

    .sensor {
      width: 8px;
      height: 8px;
      background: #111;
      border-radius: 50%;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    /* Embedded App Frame */
    .app-iframe {
      width: 100%;
      flex: 1;
      border: none;
      background: #FAF9F6;
    }

    /* Home Indicator / Navigation Bar */
    .home-bar {
      height: 22px;
      background: #FAF9F6;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .home-indicator {
      width: 130px;
      height: 4.5px;
      background: #1C1917;
      border-radius: 10px;
      opacity: 0.3;
      transition: all 0.2s;
      cursor: pointer;
    }

    .home-indicator:hover {
      opacity: 0.8;
      width: 150px;
    }

    /* Android Bottom Navbar Style */
    .android-navbar {
      height: 38px;
      background: #FAF9F6;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 40px;
      z-index: 20;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
    }

    .android-nav-btn {
      width: 18px;
      height: 18px;
      opacity: 0.6;
      cursor: pointer;
      transition: all 0.2s;
    }

    .android-nav-btn:hover {
      opacity: 1;
      transform: scale(1.15);
    }

    /* Responsive device presets */
    .preset-iphone-16 {
      width: 393px;
      height: 852px;
    }

    .preset-pixel-8 {
      width: 412px;
      height: 892px;
    }

    .preset-galaxy-s24 {
      width: 384px;
      height: 832px;
    }

    .preset-compact {
      width: 360px;
      height: 740px;
    }
  </style>
</head>
<body>

  <!-- Top Simulator Navigation Bar -->
  <header class="toolbar">
    <div class="brand-section">
      <span class="brand-badge">Phone View</span>
      <span class="brand-title">ConnectHub Mobile Simulator</span>
    </div>

    <div class="controls-group">
      <!-- Device Preset -->
      <label style="font-size: 12px; color: #94A3B8; font-weight: 600;">Device:</label>
      <select id="deviceSelect" class="select-dropdown" onchange="changeDevice(this.value)">
        <option value="preset-iphone-16">iPhone 16 Pro (393 × 852)</option>
        <option value="preset-pixel-8" selected>Google Pixel 8 Pro (412 × 892)</option>
        <option value="preset-galaxy-s24">Samsung Galaxy S24 (384 × 832)</option>
        <option value="preset-compact">Compact Android (360 × 740)</option>
      </select>

      <!-- Zoom / Scale -->
      <label style="font-size: 12px; color: #94A3B8; font-weight: 600; margin-left: 10px;">Zoom:</label>
      <select id="zoomSelect" class="select-dropdown" onchange="changeZoom(this.value)">
        <option value="0.8">80%</option>
        <option value="0.9">90%</option>
        <option value="1.0" selected>100% (Native)</option>
        <option value="1.1">110%</option>
      </select>

      <!-- Quick Actions -->
      <button class="tool-btn" onclick="reloadFrame()" title="Reload Mobile App">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Reload App
      </button>

      <button class="tool-btn" onclick="navigateTo('/#/messages')" title="Open Chat Messages">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
      </button>

      <button class="tool-btn" onclick="navigateTo('/#/groups')" title="Open Groups & Channels">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Groups
      </button>

      <a href="/connecthub-debug.apk" download class="tool-btn primary" title="Download Android APK">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download APK (161 MB)
      </a>
    </div>
  </header>

  <!-- Simulator Workspace -->
  <main class="workspace">
    <div id="phoneContainer" class="phone-container">
      <div id="phoneBezel" class="phone-bezel">
        <div id="phoneScreen" class="phone-screen preset-pixel-8">
          
          <!-- Mobile Status Bar -->
          <div class="status-bar">
            <span id="liveTime">9:41</span>
            
            <!-- Dynamic Island / Punch Hole Notch -->
            <div id="notch" class="dynamic-island" onclick="pulseNotch()">
              <div class="camera-lens"></div>
              <div class="sensor"></div>
            </div>

            <!-- Signal & Battery Icons -->
            <div class="status-icons">
              <span>5G</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.28 19.58 10.58 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="18" height="10" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13" stroke="currentColor" stroke-width="2"/></svg>
            </div>
          </div>

          <!-- Embedded Flutter Web / Mobile App -->
          <iframe id="appFrame" class="app-iframe" src="/#/login"></iframe>

          <!-- Bottom Home Indicator -->
          <div id="bottomBar" class="home-bar">
            <div class="home-indicator" onclick="navigateTo('/#/dashboard')"></div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script>
    // Live Real-Time Clock in Mobile Status Bar
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('liveTime').textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Device Preset Switcher
    function changeDevice(presetClass) {
      const screen = document.getElementById('phoneScreen');
      screen.className = 'phone-screen ' + presetClass;
    }

    // Zoom / Scale Switcher
    function changeZoom(scaleValue) {
      const container = document.getElementById('phoneContainer');
      container.style.transform = `scale(${scaleValue})`;
    }

    // Reload App Inside Phone Frame
    function reloadFrame() {
      const frame = document.getElementById('appFrame');
      frame.src = frame.src;
    }

    // Navigate to Route Inside Phone
    function navigateTo(route) {
      const frame = document.getElementById('appFrame');
      frame.src = route;
    }

    // Dynamic Island Tap Animation
    function pulseNotch() {
      const notch = document.getElementById('notch');
      notch.style.transform = 'translateX(-50%) scale(1.15)';
      setTimeout(() => {
        notch.style.transform = 'translateX(-50%) scale(1)';
      }, 300);
    }
  </script>
</body>
</html>
