# ──────────────────────────────────────────────
# ConnectHub — Reverse Proxy + TLS Configuration
# ──────────────────────────────────────────────

# ── Upstream: FastAPI Backend ────────────────
upstream connecthub_api {
    server connecthub-api:8000;
    keepalive 32;
}

# ── HTTP → HTTPS Redirect ───────────────────
server {
    listen 80;
    server_name connecthub.local;

    # Health check accessible via HTTP (for container health probes)
    location /health {
        proxy_pass http://connecthub_api/health;
        proxy_set_header Host $host;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server ─────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name connecthub.local;

    # ── TLS Configuration ────────────────────
    # Development: use self-signed certs
    # Production: replace with Let's Encrypt or organizational CA certs
    # ssl_certificate     /etc/nginx/certs/connecthub.crt;
    # ssl_certificate_key /etc/nginx/certs/connecthub.key;

    # TLS hardening (OWASP recommendations)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ─────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://$host; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── API Routes ───────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://connecthub_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $request_id;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ── Auth Routes (stricter rate limiting) ─
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://connecthub_api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $request_id;
    }

    # ── WebSocket Routes ─────────────────────
    location /ws/ {
        proxy_pass http://connecthub_api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts (keep connections alive)
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # ── Health Check ─────────────────────────
    location /health {
        proxy_pass http://connecthub_api/health;
        proxy_set_header Host $host;
    }

    # ── Docs (development only) ──────────────
    location /docs {
        proxy_pass http://connecthub_api/docs;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://connecthub_api/redoc;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://connecthub_api/openapi.json;
        proxy_set_header Host $host;
    }
}
