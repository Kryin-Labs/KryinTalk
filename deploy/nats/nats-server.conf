# ──────────────────────────────────────────────
# ConnectHub — NATS Server Configuration
# ──────────────────────────────────────────────
# Single-node development configuration with JetStream enabled.
# For production: enable clustering (3-node Raft) and TLS.
# ──────────────────────────────────────────────

# ── Server Identity ──────────────────────────
server_name: connecthub-nats

# ── Client Connections ───────────────────────
port: 4222
max_connections: 1024
max_payload: 1MB

# ── HTTP Monitoring ──────────────────────────
http_port: 8222

# ── JetStream Configuration ─────────────────
jetstream {
    # Storage directory for JetStream data
    store_dir: /data/jetstream

    # Maximum storage (adjust for production)
    max_mem_store: 256MB
    max_file_store: 1GB
}

# ── Logging ──────────────────────────────────
# Development: verbose logging
# Production: set to false
debug: false
trace: false
logtime: true

# ── Authorization (Development) ──────────────
# TODO (Phase 2): Enable NKey-based authentication
# For development, no auth is required.
# Production MUST enable authentication:
#
# authorization {
#     users = [
#         { user: "connecthub", password: "$NATS_PASSWORD" }
#     ]
# }

