[project]
name = "connecthub"
version = "0.1.0"
description = "Enterprise Communication Platform — Simplified. Secured."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Redis
    "redis[hiredis]>=5.2.0",
    # NATS (event broker)
    "nats-py>=2.9.0",
    # Configuration & validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Security
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    # Utilities
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.urls]
Repository = "https://github.com/connecthub/connecthub"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connecthub"]

# ──────────────────────────────────────────────
# Development Dependencies
# ──────────────────────────────────────────────
[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

# ──────────────────────────────────────────────
# Tool Configuration
# ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]
# FastAPI's Depends() is intentionally evaluated in route signatures.
ignore = ["S101", "B008"]  # Allow asserts in tests and FastAPI dependencies

[tool.ruff.lint.isort]
known-first-party = ["connecthub"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
